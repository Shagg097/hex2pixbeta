name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish hex2pix
    runs-on: windows-latest
    steps:
      - name: Check out the tag
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install build requirements
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Check the tag matches the package version
        shell: bash
        run: |
          tag="${{ github.ref_name }}"
          version="$(python -c 'import hex2pix; print(hex2pix.__version__)')"
          if [ "${tag#v}" != "$version" ]; then
            echo "Tag $tag does not match hex2pix.__version__ $version." >&2
            echo "Bump hex2pix/__init__.py before tagging." >&2
            exit 1
          fi

      - name: Run the unit tests
        run: python -m unittest discover -s hex2pix/tests -t .

      - name: Build hex2pix.exe
        run: python -m PyInstaller --noconfirm --clean --distpath dist --workpath build packaging/hex2pix.spec

      - name: Build the portable folder
        run: python -m PyInstaller --noconfirm --clean --distpath dist --workpath build packaging/hex2pix_onedir.spec

      - name: Zip the portable folder
        shell: pwsh
        run: |
          if (-not (Test-Path dist/hex2pix-portable/hex2pix.exe)) {
            throw "The portable folder build is missing its executable."
          }
          Compress-Archive -Path dist/hex2pix-portable -DestinationPath dist/hex2pix-portable.zip -Force

      - name: Smoke-test both builds
        shell: bash
        run: |
          set -euo pipefail
          dist/hex2pix-portable/hex2pix.exe --selftest
          grep -q "RESULT: PASS" hex2pix-selftest.txt
          rm -f hex2pix-selftest.txt
          dist/hex2pix.exe --selftest
          grep -q "RESULT: PASS" hex2pix-selftest.txt
          rm -f hex2pix-selftest.txt

      - name: Attach the builds to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          test -s dist/hex2pix.exe
          test -s dist/hex2pix-portable.zip
          flags=(--title "hex2pix $tag" --generate-notes)
          if [[ "$tag" =~ [A-Za-z] ]]; then
            flags+=(--prerelease)
          fi
          assets=(dist/hex2pix.exe dist/hex2pix-portable.zip)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" "${flags[@]}"
          fi
          gh release view "$tag" --json assets --jq '.assets[] | "\(.name) \(.size) bytes"'
