name: Windows 7 build (CPython 3.8.20)

# Compatibility line only: `main` stays on Python 3.10 through release.yml.
# CPython 3.8 is the last release that runs on Windows 7, and python.org ships
# no Windows installer for 3.8.20 (3.8.11 and later were security-only), so the
# build uses a stand-alone CPython with Tcl/Tk. It is unpacked into .py38/ in the
# checkout and always called by path: the runner's RUNNER_TEMP is a backslash
# Windows path that bash steps cannot use portably, and the bash $PWD is a POSIX
# path that Windows PATH lookups cannot use.
on:
  push:
    branches:
      - win7-compat
  pull_request:
    branches:
      - win7-compat
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test on Python 3.8.20
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install stand-alone CPython 3.8.20
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/astral-sh/python-build-standalone/releases/download/20240909/cpython-3.8.20%2B20240909-x86_64-pc-windows-msvc-install_only.tar.gz"
          mkdir -p .py38
          curl --fail --location --silent --show-error --retry 3 -o pbs38.tar.gz "$url"
          tar -xzf pbs38.tar.gz -C .py38
          rm -f pbs38.tar.gz
          test -f .py38/python/python.exe
          ./.py38/python/python.exe -c "import sys, tkinter; print(sys.version); print('Tk', tkinter.TkVersion)"

      - name: Install build requirements
        shell: bash
        run: ./.py38/python/python.exe -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run the unit tests
        shell: bash
        run: ./.py38/python/python.exe -m unittest discover -s hex2pix/tests -t .

      - name: Build hex2pix.exe
        shell: bash
        run: |
          set -euo pipefail
          ./.py38/python/python.exe -m PyInstaller --noconfirm --clean --distpath dist --workpath build packaging/hex2pix.spec

      - name: Build the portable folder
        shell: bash
        run: |
          set -euo pipefail
          ./.py38/python/python.exe -m PyInstaller --noconfirm --clean --distpath dist --workpath build packaging/hex2pix_onedir.spec

      - name: Confirm the frozen interpreter is 3.8
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/hex2pix-portable/_internal/python38.dll
          if grep -aq python310.dll dist/hex2pix.exe; then
            echo "dist/hex2pix.exe still embeds python310.dll" >&2
            exit 1
          fi
          grep -aq python38.dll dist/hex2pix.exe

      - name: Smoke-test both builds
        shell: bash
        run: |
          set -euo pipefail
          dist/hex2pix-portable/hex2pix.exe --selftest
          grep -q "RESULT: PASS" hex2pix-selftest.txt
          rm -f hex2pix-selftest.txt
          dist/hex2pix.exe --selftest
          grep -q "RESULT: PASS" hex2pix-selftest.txt
          rm -f hex2pix-selftest.txt

      - name: Zip the portable folder
        shell: pwsh
        run: |
          if (-not (Test-Path dist/hex2pix-portable/hex2pix.exe)) {
            throw "The portable folder build is missing its executable."
          }
          Compress-Archive -Path dist/hex2pix-portable -DestinationPath dist/hex2pix-portable.zip -Force

      - name: Upload the Windows 7 builds
        uses: actions/upload-artifact@v4
        with:
          name: hex2pix-py38-win7
          path: |
            dist/hex2pix.exe
            dist/hex2pix-portable.zip
