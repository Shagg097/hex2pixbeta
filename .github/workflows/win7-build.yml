name: Windows 7 build (CPython 3.8.20, 32-bit)

# Compatibility line only: `main` stays on Python 3.10 through release.yml.
# CPython 3.8 is the last release that runs on Windows 7, and python.org ships
# no Windows installer for 3.8.20 (3.8.11 and later were security-only). This
# build uses R-YaTian's Windows XP build of CPython 3.8.20: a 32-bit runtime
# with Tcl/Tk whose python38.dll declares a Windows 5.1 subsystem. It is
# unpacked into python38-32/ in the checkout and always called by path: the runner's
# RUNNER_TEMP is a backslash Windows path that bash steps cannot use portably,
# and the bash $PWD is a POSIX path that Windows PATH lookups cannot use.
#
# PyInstaller 6's bootloader declares a Windows 6.0 subsystem, so the output of
# this workflow needs Windows Vista/7 or newer. The retro-compat branch uses
# cx_Freeze, whose launcher declares 5.1, for Windows XP.
on:
  push:
    branches:
      - win7-compat
  pull_request:
    branches:
      - win7-compat
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test on 32-bit Python 3.8.20
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Cache CPython 3.8.20 (32-bit, XP build)
        uses: actions/cache@v4
        with:
          path: python38-32
          key: cpython-3.8.20-winxp-20241202-x86

      - name: Install CPython 3.8.20 (32-bit)
        shell: bash
        run: |
          set -euo pipefail
          # The installer is a WiX Burn bundle. Include_pip and Include_tcltk
          # matter here; documentation, tests, the launcher, PATH changes and
          # shortcuts do not.
          if ./python38-32/python.exe -c "import sys" 2>/dev/null; then
            echo "using the cached CPython"
          else
            rm -rf python38-32
            url="https://github.com/R-YaTian/CPython3.8.20WinXP/releases/download/v3.8.20_final/python-3.8.20-full.exe"
            curl --fail --location --silent --show-error \
              --retry 8 --retry-delay 5 --retry-max-time 300 --connect-timeout 20 \
              -o py38xp.exe "$url"
            MSYS_NO_PATHCONV=1 ./py38xp.exe /quiet InstallAllUsers=0 \
              TargetDir="$(cygpath -w "$PWD/python38-32")" \
              Include_doc=0 Include_test=0 Include_launcher=0 Include_pip=1 \
              Include_tcltk=1 PrependPath=0 Shortcuts=0 AssociateFiles=0 || true
            rm -f py38xp.exe
          fi
          test -f python38-32/python.exe
          ./python38-32/python.exe -c "import sys, platform, tkinter; assert platform.architecture()[0] == '32bit'; print(sys.version); print('Tk', tkinter.TkVersion)"

      - name: Install build requirements
        shell: bash
        run: ./python38-32/python.exe -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run the unit tests
        shell: bash
        run: ./python38-32/python.exe -m unittest discover -s hex2pix/tests -t .

      - name: Build hex2pix.exe
        shell: bash
        run: |
          set -euo pipefail
          ./python38-32/python.exe -m PyInstaller --noconfirm --clean --distpath dist --workpath build packaging/hex2pix.spec

      - name: Build the portable folder
        shell: bash
        run: |
          set -euo pipefail
          ./python38-32/python.exe -m PyInstaller --noconfirm --clean --distpath dist --workpath build packaging/hex2pix_onedir.spec

      - name: Confirm both builds are 32-bit Python 3.8
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/hex2pix-portable/_internal/python38.dll
          if grep -aq python310.dll dist/hex2pix.exe; then
            echo "dist/hex2pix.exe still embeds python310.dll" >&2
            exit 1
          fi
          grep -aq python38.dll dist/hex2pix.exe
          ./python38-32/python.exe - <<'PY'
          import pefile
          for path in ("dist/hex2pix.exe", "dist/hex2pix-portable/hex2pix.exe"):
              pe = pefile.PE(path, fast_load=True)
              assert pe.FILE_HEADER.Machine == 0x14C, path
              print(path, "32-bit, subsystem",
                    pe.OPTIONAL_HEADER.MajorSubsystemVersion,
                    pe.OPTIONAL_HEADER.MinorSubsystemVersion)
          PY

      - name: Smoke-test both builds
        shell: bash
        run: |
          set -euo pipefail
          dist/hex2pix-portable/hex2pix.exe --selftest
          grep -q "RESULT: PASS" hex2pix-selftest.txt
          rm -f hex2pix-selftest.txt
          dist/hex2pix.exe --selftest
          grep -q "RESULT: PASS" hex2pix-selftest.txt
          rm -f hex2pix-selftest.txt

      - name: Zip the portable folder
        shell: pwsh
        run: |
          if (-not (Test-Path dist/hex2pix-portable/hex2pix.exe)) {
            throw "The portable folder build is missing its executable."
          }
          Compress-Archive -Path dist/hex2pix-portable -DestinationPath dist/hex2pix-portable.zip -Force

      - name: Upload the Windows 7 builds
        uses: actions/upload-artifact@v4
        with:
          name: hex2pix-py38-win7-x86
          path: |
            dist/hex2pix.exe
            dist/hex2pix-portable.zip
